<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Wellness - Profile</title>

    <link rel="stylesheet"
          href="profile.css">

</head>

<body>

    <div class="container">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-icon">
                    👤
                </div>

                <h1>My Profile</h1>

                <p>Manage your AI Wellness profile</p>

            </div>


            <div id="message"
                 class="message">
            </div>


            <form id="profileForm">

                <label>User ID</label>

                <input
                    type="text"
                    id="userId"
                    value="1"
                    readonly
                >


                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Role</label>

                <input
                    type="text"
                    id="role"
                    readonly
                >


                <label>Profile Image</label>

                <input
                    type="text"
                    id="profileImage"
                    placeholder="Enter image URL"
                >


                <label>Account Status</label>

                <input
                    type="text"
                    id="accountStatus"
                    readonly
                >


                <div class="buttons">

                    <button
                        type="button"
                        id="loadBtn">
                        Load Profile
                    </button>

                    <button
                        type="submit"
                        id="updateBtn">
                        Update Profile
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="profile.js"></script>

</body>

</html>
