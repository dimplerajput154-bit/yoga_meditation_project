<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Wellness Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            🌿 <span>AI Wellness</span>
        </div>

        <nav>
            <button class="menu active">🏠 Dashboard</button>
            <button class="menu">🧘 Yoga</button>
            <button class="menu">🧘 Meditation</button>
            <button class="menu">🍎 Healthy Recipes</button>
            <button class="menu">😴 Sleep Tracker</button>
            <button class="menu">😊 Mood Tracker</button>
            <button class="menu">💚 Health & Wellness</button>
            <button class="menu">🌿 Home Remedies</button>
            <button class="menu">🤖 AI Wellness Assistant</button>
            <button class="menu">👤 Profile</button>
        </nav>

        <button class="logout" onclick="logout()">
            🚪 Logout
        </button>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Good Morning, <span id="userName">User</span> 👋</h1>
                <p>Take care of your mind and body today.</p>
            </div>

            <div class="profile-icon">
                👤
            </div>

        </header>


        <!-- Wellness Cards -->
        <section class="cards">

            <div class="card">
                <div class="card-icon">😴</div>

                <h3>Sleep</h3>

                <h2 id="sleepHours">--</h2>

                <p id="sleepStatus">Loading...</p>
            </div>


            <div class="card">
                <div class="card-icon">😊</div>

                <h3>Mood</h3>

                <h2 id="moodScore">--</h2>

                <p id="moodPercentage">--</p>
            </div>


            <div class="card">
                <div class="card-icon">🧘</div>

                <h3>Yoga</h3>

                <h2>
                    <span id="yogaMinutes">0</span>
                    min
                </h2>

                <p>
                    Goal:
                    <span id="yogaGoal">0</span> min
                </p>
            </div>


            <div class="card">
                <div class="card-icon">💧</div>

                <h3>Water</h3>

                <h2>
                    <span id="waterGlasses">0</span>
                    / 8
                </h2>

                <p>Glasses today</p>
            </div>

        </section>


        <!-- Progress Section -->
        <section class="progress-section">

            <div class="progress-card">

                <h2>🚶 Daily Steps</h2>

                <div class="step-number">
                    <span id="stepsCount">0</span>
                    /
                    <span id="stepsGoal">0</span>
                </div>

                <div class="progress-bar">
                    <div id="stepsProgress"></div>
                </div>

            </div>


            <div class="progress-card">

                <h2>💧 Water Goal</h2>

                <div class="step-number">
                    <span id="waterCount">0</span>
                    /
                    <span id="waterGoal">0</span>
                    glasses
                </div>

                <div class="progress-bar">
                    <div id="waterProgress"></div>
                </div>

            </div>

        </section>


        <!-- Tasks -->
        <section class="tasks-section">

            <div class="section-title">
                <h2>Today's Wellness Tasks</h2>
                <span id="taskCount">0 Tasks</span>
            </div>

            <div id="tasksContainer">

                <p class="loading">
                    Loading tasks...
                </p>

            </div>

        </section>

    </main>

</div>


<script src="dashboard.js"></script>

</body>
</html>
